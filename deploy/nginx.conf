worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;

    # Docker DNS returns every rental-api replica; nginx balances over them round-robin.
    # The name is re-resolved while running, so recreated or scaled replicas get
    # traffic without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream rental_api {
        zone rental_api 64k;
        server rental-api:8080 resolve;
        keepalive 512;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://rental_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
