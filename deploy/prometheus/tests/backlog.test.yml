rule_files:
  - ../rules/backlog.yml

evaluation_interval: 5s

tests:
  - name: "Очередь готовых задач растёт в двух окнах, алерт ждёт 2 минуты и снимается после обработки"
    interval: 1m
    input_series:
      - series: 'rental_tasks_ready{job="rental-maintenance",instance="first",kind="SETTLE"}'
        values: '0+0x4 1+0x4 2+0x2 0+0x3'
      - series: 'rental_tasks_ready{job="rental-maintenance",instance="second",kind="SETTLE"}'
        values: '0+0x4 1+0x4 2+0x2 0+0x3'
      - series: 'rental_tasks_ready{job="rental-maintenance",instance="first",kind="VOID"}'
        values: '1+0x16'
    promql_expr_test:
      - expr: 'rental:ready_tasks:max{kind="SETTLE"}'
        eval_time: 12m
        exp_samples:
          - labels: 'rental:ready_tasks:max{kind="SETTLE"}'
            value: 2
    alert_rule_test:
      - eval_time: 9m55s
        alertname: RentalReadyTasksGrowing
        exp_alerts: []
      - eval_time: 11m55s
        alertname: RentalReadyTasksGrowing
        exp_alerts: []
      - eval_time: 12m
        alertname: RentalReadyTasksGrowing
        exp_alerts:
          - exp_labels: {kind: SETTLE, severity: warning}
            exp_annotations:
              summary: "Очередь готовых задач SETTLE растёт"
              description: "Число готовых задач выросло в каждом из двух 5-минутных окон. Проверьте ожидание в очереди и журнал worker."
      - eval_time: 13m
        alertname: RentalReadyTasksGrowing
        exp_alerts: []

  - name: "Разовый всплеск, рост общего PENDING и старение очереди постоянной длины не вызывают алерт роста"
    interval: 1m
    input_series:
      - series: 'rental_tasks_ready{job="rental-maintenance",instance="first",kind="VOID"}'
        values: '0+0x4 30+0x17'
      - series: 'rental_tasks_ready{job="rental-worker",instance="first",kind="SETTLE"}'
        values: '0+1x21'
      - series: 'rental_tasks{job="rental-maintenance",instance="first",kind="START",status="PENDING"}'
        values: '0+1x21'
      - series: 'rental_tasks_ready{job="rental-maintenance",instance="first",kind="START"}'
        values: '1+0x21'
      - series: 'rental_tasks_oldest_ready_wait_seconds{job="rental-maintenance",instance="first",kind="START"}'
        values: '0+60x21'
    alert_rule_test:
      - eval_time: 7m
        alertname: RentalReadyTasksGrowing
        exp_alerts: []
      - eval_time: 12m
        alertname: RentalReadyTasksGrowing
        exp_alerts: []
      - eval_time: 17m
        alertname: RentalReadyTasksGrowing
        exp_alerts: []

  - name: "Отставание архивации превышает 3 минуты в течение 5 минут"
    interval: 1m
    input_series:
      - series: 'rental_archive_oldest_ready_order_age_seconds{job="rental-maintenance",instance="first"}'
        values: '180+0x1 181+0x5 0+0x2'
      - series: 'rental_archive_oldest_ready_order_age_seconds{job="rental-maintenance",instance="second"}'
        values: '90+0x10'
    alert_rule_test:
      - eval_time: 1m55s
        alertname: RentalArchiveLagHigh
        exp_alerts: []
      - eval_time: 6m55s
        alertname: RentalArchiveLagHigh
        exp_alerts: []
      - eval_time: 7m
        alertname: RentalArchiveLagHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Архивация заказов отстаёт"
              description: "Старейший закрытый заказ без связанных задач ждёт больше 3 минут. Проверьте журнал maintenance."
      - eval_time: 8m
        alertname: RentalArchiveLagHigh
        exp_alerts: []

  - name: "Краткая задержка архивации не вызывает алерт"
    interval: 1m
    input_series:
      - series: 'rental_archive_oldest_ready_order_age_seconds{job="rental-maintenance",instance="first"}'
        values: '0 200+0x2 60+0x7'
      - series: 'rental_archive_oldest_ready_order_age_seconds{job="rental-api",instance="first"}'
        values: '300+0x11'
    alert_rule_test:
      - eval_time: 3m55s
        alertname: RentalArchiveLagHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: RentalArchiveLagHigh
        exp_alerts: []
