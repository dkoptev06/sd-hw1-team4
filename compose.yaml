name: rental

x-ready: &ready
  interval: 2s
  timeout: 2s
  retries: 30

x-rental: &rental
  image: &rental-image sd-hw1-team4-rental:local
  pull_policy: never
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    source:
      condition: service_healthy
    payment:
      condition: service_healthy
  healthcheck:
    <<: *ready
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]

x-rental-env: &rental-env
  DATABASE_URL: postgres://rental:rental@postgres:5432/rental?sslmode=disable
  SOURCE_URL: http://source:8080
  PAYMENT_URL: http://payment:8080

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      TZ: UTC
    ports:
      - "127.0.0.1:${RENTAL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      <<: *ready
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  migrate:
    image: *rental-image
    pull_policy: never
    command: ["migrate"]
    environment: *rental-env
    depends_on:
      postgres:
        condition: service_healthy

  rental-api:
    <<: *rental
    build: ./services/rental
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      source:
        condition: service_healthy
      payment:
        condition: service_healthy
      redis:
        condition: service_started
        required: false
    environment:
      <<: *rental-env
      RENTAL_DB_MAX_CONNS: "40"
      REDIS_URL: redis://redis:6379
    deploy:
      replicas: ${RENTAL_API_REPLICAS:-2}

  rental-worker:
    <<: *rental
    command: ["worker"]
    environment:
      <<: *rental-env
      RENTAL_DB_MAX_CONNS: "30"
    deploy:
      replicas: ${RENTAL_WORKER_REPLICAS:-2}

  rental-maintenance:
    <<: *rental
    command: ["maintenance"]
    environment:
      <<: *rental-env
      RENTAL_DB_MAX_CONNS: "5"
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${RENTAL_HTTP_PORT:-18080}:8080"
    depends_on:
      rental-api:
        condition: service_healthy

  source:
    build: ./services/source
    restart: unless-stopped
    healthcheck:
      <<: *ready
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    ports:
      - "127.0.0.1:${SOURCE_HTTP_PORT:-18081}:8080"

  payment:
    build: ./services/payment
    restart: unless-stopped
    healthcheck:
      <<: *ready
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-18082}:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
