name: rental-core

x-http-healthcheck: &http-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
  interval: 2s
  timeout: 2s
  retries: 15

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      TZ: UTC
    ports:
      - "127.0.0.1:${RENTAL_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: sd-hw1-team4-rental:local
    command: ["migrate"]
    environment:
      DATABASE_URL: &db-url postgres://rental:rental@postgres:5432/rental?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  rental:
    build: ./services/rental
    image: sd-hw1-team4-rental:local
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
    ports:
      - "127.0.0.1:${RENTAL_HTTP_PORT:-18080}:8080"

  source:
    build: ./services/source
    healthcheck: *http-healthcheck
    ports:
      - "127.0.0.1:${SOURCE_HTTP_PORT:-18081}:8080"

  payment:
    build: ./services/payment
    healthcheck: *http-healthcheck
    ports:
      - "127.0.0.1:${PAYMENT_HTTP_PORT:-18082}:8080"

volumes:
  postgres-data:
